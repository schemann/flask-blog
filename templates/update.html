<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Blog Post - My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Update Blog Post</h1>
    <p class="nav"><a href="{{ url_for('index') }}">&larr; Back to all posts</a></p>
    <form class="post post-form" action="{{ url_for('update', post_id=post['id']) }}" method="POST">
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ post['author'] }}" required>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ post['title'] }}" required>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="8" required>{{ post['content'] }}</textarea>

        <button type="submit" class="button">Update</button>
    </form>
</body>
</html>
